name: Browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Run desktop and mobile browser checks
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/browser-qa.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 7
